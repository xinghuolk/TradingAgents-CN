name: 上游同步检查

on:
  schedule:
    # 每周一上午9点检查上游更新
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    name: 检查上游更新
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 添加上游仓库
      run: |
        git remote add upstream https://github.com/TauricResearch/TradingAgents.git || true
        git fetch upstream
    
    - name: 检查上游更新
      id: check_updates
      run: |
        # 获取上游新提交数量
        NEW_COMMITS=$(git rev-list --count HEAD..upstream/main)
        echo "new_commits=$NEW_COMMITS" >> $GITHUB_OUTPUT
        
        if [ "$NEW_COMMITS" -gt 0 ]; then
          echo "has_updates=true" >> $GITHUB_OUTPUT
          echo "发现 $NEW_COMMITS 个新提交"
          
          # 获取最新提交信息
          git log --oneline --no-merges -n 10 HEAD..upstream/main > recent_commits.txt
          echo "recent_commits<<EOF" >> $GITHUB_OUTPUT
          cat recent_commits.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "has_updates=false" >> $GITHUB_OUTPUT
          echo "没有新的上游更新"
        fi
    
    - name: 分析更新类型
      if: steps.check_updates.outputs.has_updates == 'true'
      id: analyze_updates
      run: |
        # 分析提交类型
        FEATURES=$(git log --format=%s --no-merges HEAD..upstream/main | awk 'tolower($0) ~ /(feat|feature|add)/ { count++ } END { print count + 0 }')
        FIXES=$(git log --format=%s --no-merges HEAD..upstream/main | awk 'tolower($0) ~ /(fix|bug|patch)/ { count++ } END { print count + 0 }')
        DOCS=$(git log --format=%s --no-merges HEAD..upstream/main | awk 'tolower($0) ~ /(doc|readme)/ { count++ } END { print count + 0 }')
        
        echo "features=$FEATURES" >> $GITHUB_OUTPUT
        echo "fixes=$FIXES" >> $GITHUB_OUTPUT
        echo "docs=$DOCS" >> $GITHUB_OUTPUT
        
        # 判断更新优先级
        if [ "$FIXES" -gt 0 ]; then
          echo "priority=high" >> $GITHUB_OUTPUT
          echo "reason=包含Bug修复" >> $GITHUB_OUTPUT
        elif [ "$FEATURES" -gt 2 ]; then
          echo "priority=medium" >> $GITHUB_OUTPUT
          echo "reason=包含多个新功能" >> $GITHUB_OUTPUT
        else
          echo "priority=low" >> $GITHUB_OUTPUT
          echo "reason=常规更新" >> $GITHUB_OUTPUT
        fi
    
    - name: 创建Issue报告
      if: steps.check_updates.outputs.has_updates == 'true'
      uses: actions/github-script@v7
      env:
        NEW_COMMITS: ${{ steps.check_updates.outputs.new_commits }}
        RECENT_COMMITS: ${{ steps.check_updates.outputs.recent_commits }}
        FEATURES: ${{ steps.analyze_updates.outputs.features }}
        FIXES: ${{ steps.analyze_updates.outputs.fixes }}
        DOCS: ${{ steps.analyze_updates.outputs.docs }}
        PRIORITY: ${{ steps.analyze_updates.outputs.priority }}
        REASON: ${{ steps.analyze_updates.outputs.reason }}
      with:
        script: |
          const newCommits = process.env.NEW_COMMITS;
          const recentCommits = process.env.RECENT_COMMITS;
          const features = process.env.FEATURES;
          const fixes = process.env.FIXES;
          const docs = process.env.DOCS;
          const priority = process.env.PRIORITY;
          const reason = process.env.REASON;
          
          const issueTitle = `🔄 上游更新检测 - ${newCommits} 个新提交`;
          const issueBody = `
          ## 📊 更新概览
          
          - **新提交数量**: ${newCommits}
          - **更新优先级**: ${priority.toUpperCase()}
          - **优先级原因**: ${reason}
          
          ## 📈 更新分析
          
          - 🆕 新功能: ${features} 个
          - 🐛 Bug修复: ${fixes} 个  
          - 📚 文档更新: ${docs} 个
          
          ## 📋 最近提交
          
          \`\`\`
          ${recentCommits}
          \`\`\`
          
          ## 🎯 建议行动
          
          ${priority === 'high' ? 
            '⚠️ **建议立即同步** - 包含重要的Bug修复' : 
            priority === 'medium' ? 
            '📅 **建议本周内同步** - 包含有价值的新功能' : 
            '📝 **可以计划同步** - 常规更新，可以安排时间同步'
          }
          
          ## 🔧 同步步骤
          
          1. 检查当前工作状态
          2. 运行同步脚本: \`python scripts/sync_upstream.py\`
          3. 解决可能的冲突
          4. 测试功能完整性
          5. 更新相关文档
          
          ## 📞 相关链接
          
          - [上游仓库](https://github.com/TauricResearch/TradingAgents)
          - [同步策略文档](docs/maintenance/upstream-sync.md)
          - [同步脚本](scripts/sync_upstream.py)
          
          ---
          
          *此Issue由GitHub Actions自动创建于 ${new Date().toISOString()}*
          `;
          
          // 检查是否已有相似的Issue
          const existingIssues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'upstream-sync'
          });
          
          const hasOpenSyncIssue = existingIssues.data.some(issue => 
            issue.title.includes('上游更新检测')
          );
          
          if (!hasOpenSyncIssue) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['upstream-sync', priority === 'high' ? 'priority-high' : priority === 'medium' ? 'priority-medium' : 'priority-low']
            });
            
            console.log('✅ 已创建上游更新Issue');
          } else {
            console.log('ℹ️ 已存在开放的同步Issue，跳过创建');
          }
    
    - name: 发送通知
      if: steps.check_updates.outputs.has_updates == 'true'
      run: |
        echo "📧 上游更新通知已发送"
        echo "- 新提交数量: ${{ steps.check_updates.outputs.new_commits }}"
        echo "- 更新优先级: ${{ steps.analyze_updates.outputs.priority }}"
        echo "- 已创建Issue进行跟踪"
