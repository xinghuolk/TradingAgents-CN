version: '3.8'

# TradingAgents-CN v1.0.0-preview Docker Compose配置
# 支持前后端分离部署

services:
  # FastAPI 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # financial-report-llm-extractor 的 git rev（构建时拉取）。
        # 在 .env 里设 FINANCIAL_REPORT_EXTRACTOR_REV=<sha> 覆盖；不设则用此默认。
        FINANCIAL_REPORT_EXTRACTOR_REV: ${FINANCIAL_REPORT_EXTRACTOR_REV:-e7c7d2d34e9253f33ac4a398bf56e9298dd47938}
        # 本地调试默认跳过 GitHub tarball，运行时使用挂载 checkout + PYTHONPATH。
        # 需要构建独立镜像时设 INSTALL_FINANCIAL_REPORT_EXTRACTOR=true。
        INSTALL_FINANCIAL_REPORT_EXTRACTOR: ${INSTALL_FINANCIAL_REPORT_EXTRACTOR:-false}
    image: tradingagents-backend:v1.0.0-preview
    container_name: tradingagents-backend
    ports:
      - "8000:8000"
    volumes:
      # 日志目录映射
      - ./logs:/app/logs
      # 配置目录映射
      - ./config:/app/config
      # 数据目录映射
      - ./data:/app/data
      # 开发模式：挂载核心包与测试，宿主改动实时生效（value 多源币种归一改造期间）
      - ./tradingagents:/app/tradingagents
      - ./tests:/app/tests
      # 复用本机 financial-report-llm-extractor checkout；缓存默认落在该目录的 tmp/.cache
      - ${FINANCIAL_REPORT_EXTRACTOR_HOST_ROOT:-./external/financial-report-llm-extractor}:/app/external/financial-report-llm-extractor
      # 年报 PDF 独立挂载，可直接指向 report-collector 的 downloads 目录
      - ${FINANCIAL_REPORT_PDF_HOST_ROOT:-./external/financial-report-pdfs}:/app/external/financial-report-pdfs
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      # Prefer the mounted local financial-report-llm-extractor checkout in
      # development; fall back to the image's GitHub-pinned package if absent.
      PYTHONPATH: "/app/external/financial-report-llm-extractor/src"
      TZ: "Asia/Shanghai"
      # 日志配置
      TRADINGAGENTS_LOG_LEVEL: "INFO"
      TRADINGAGENTS_LOG_DIR: "/app/logs"
      TRADINGAGENTS_LOG_FILE: "/app/logs/tradingagents.log"
      # Docker专用数据库配置
      TRADINGAGENTS_MONGODB_URL: mongodb://admin:tradingagents123@mongodb:27017/tradingagents?authSource=admin
      TRADINGAGENTS_REDIS_URL: redis://:tradingagents123@redis:6379
      TRADINGAGENTS_CACHE_TYPE: redis
      # Docker环境标识
      DOCKER_CONTAINER: "true"
      # API配置
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      # CORS配置
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://localhost:5173"
      # 价值投资/龟龟投资：financial-report-llm-extractor 集成（默认关闭，按需在 .env 中启用）
      FINANCIAL_REPORT_CLIENT_ENABLED: "${FINANCIAL_REPORT_CLIENT_ENABLED:-false}"
      FINANCIAL_REPORT_CACHE_ONLY: "${FINANCIAL_REPORT_CACHE_ONLY:-false}"
      FINANCIAL_REPORT_FORCE_REFRESH: "${FINANCIAL_REPORT_FORCE_REFRESH:-false}"
      FINANCIAL_REPORT_INCLUDE_LLM_SUPPLEMENT: "${FINANCIAL_REPORT_INCLUDE_LLM_SUPPLEMENT:-false}"
      FINANCIAL_REPORT_ALLOW_LLM_MODELS: "${FINANCIAL_REPORT_ALLOW_LLM_MODELS:-}"
      FINANCIAL_REPORT_EXTRACTOR_CONTAINER_ROOT: "/app/external/financial-report-llm-extractor"
      FINANCIAL_REPORT_PDF_CONTAINER_ROOT: "/app/external/financial-report-pdfs"
      FINANCIAL_REPORT_PDF_ROOT: "${FINANCIAL_REPORT_PDF_ROOT:-/app/external/financial-report-pdfs}"
      TURTLE_RF_RATE_CN: "${TURTLE_RF_RATE_CN:-0.02}"
      TURTLE_RF_RATE_HK: "${TURTLE_RF_RATE_HK:-0.04}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradingagents-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Vue 3 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: tradingagents-frontend:v1.0.0-preview
    container_name: tradingagents-frontend
    ports:
      - "3000:80"
    environment:
      TZ: "Asia/Shanghai"
      # 后端API地址
      VITE_API_BASE_URL: "http://localhost:8000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tradingagents-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # MongoDB 数据库服务
  mongodb:
    image: mongo:4.4
    container_name: tradingagents-mongodb
    restart: unless-stopped
    ports:
      - "37017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: tradingagents123
      MONGO_INITDB_DATABASE: tradingagents
      TZ: "Asia/Shanghai"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - tradingagents-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: tradingagents-redis
    restart: unless-stopped
    ports:
      - "26379:6379"
    environment:
      TZ: "Asia/Shanghai"
    command: redis-server --appendonly yes --requirepass tradingagents123
    volumes:
      - redis_data:/data
    networks:
      - tradingagents-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # Redis Commander 管理界面（可选）
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: tradingagents-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:tradingagents123
    networks:
      - tradingagents-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - management

  # Mongo Express 管理界面（可选）
  mongo-express:
    image: mongo-express:latest
    container_name: tradingagents-mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: tradingagents123
      ME_CONFIG_MONGODB_URL: mongodb://admin:tradingagents123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: tradingagents123
    networks:
      - tradingagents-network
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - management

# 数据卷定义
volumes:
  mongodb_data:
    driver: local
    name: tradingagents_mongodb_data
  redis_data:
    driver: local
    name: tradingagents_redis_data

# 网络定义
networks:
  tradingagents-network:
    driver: bridge
    name: tradingagents-network
